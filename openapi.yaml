openapi: "3.0.3"
info:
  title: Notification Relay API
  description: |
    A notification delivery relay that sends alerts through Email, SMS, and Voice
    to on-call groups, with LDAP-based membership syncing and RBAC.

    ## Authentication

    All endpoints require HTTP Basic Auth. Credentials are verified against LDAP.
    The caller's roles are resolved from their LDAP group membership:

    | Role        | Permissions            |
    |-------------|------------------------|
    | `admin`     | admin + publish + read |
    | `publisher` | publish + read         |
    | `reader`    | read only              |
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - basicAuth: []

tags:
  - name: Events
    description: Manage discrete events (e.g. alerts)
  - name: Notifications
    description: Publish and inspect notifications sent for events
  - name: Deliveries
    description: Inspect individual delivery attempts
  - name: Groups
    description: Read LDAP group membership (synced periodically)
  - name: Sync Groups
    description: Manage which LDAP groups the syncer mirrors into the group_members table
  - name: Templates
    description: Manage email templates used for email-channel deliveries
  - name: Audit
    description: Admin-only audit log of all user actions
  - name: SMS Subscriptions
    description: Manage SMS opt-in subscriptions for toll-free number compliance

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of records to return (1–200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    offset:
      name: offset
      in: query
      description: Number of records to skip
      schema:
        type: integer
        minimum: 0
        default: 0

    event_id:
      name: event_id
      in: path
      required: true
      schema:
        type: string

    notification_id:
      name: notification_id
      in: path
      required: true
      schema:
        type: string

    delivery_id:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string

    group_name:
      name: group_name
      in: path
      required: true
      schema:
        type: string

    template_name:
      name: template_name
      in: path
      required: true
      schema:
        type: string

    subscription_username:
      name: username
      in: path
      required: true
      description: The username of the subscriber
      schema:
        type: string

  schemas:
    Destination:
      type: object
      required: [channel, target]
      properties:
        channel:
          type: string
          enum: [sms, voice, email]
        target:
          type: string
          description: |
            Recipient address for this channel:
            email address for `email`, E.164 phone number (e.g. `+12125551234`) for `sms`/`voice`

    Event:
      type: object
      required: [id, event_id, start_time, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Internal database ID
        event_id:
          type: string
          description: External event identifier
        event_url:
          type: string
          description: URL associated with the event
        event_name:
          type: string
        event_description:
          type: string
        event_severity:
          type: string
        start_time:
          type: string
          format: date-time
          description: Event start time (RFC3339)
        end_time:
          type: string
          format: date-time
          description: Event end time (RFC3339); empty string while the event is active
        created_by:
          type: string
          description: Username of the user who created the event
        created_at:
          type: string
          format: date-time
          description: When the event was created (RFC3339)
        modified_by:
          type: string
          description: Username of the last user to update the event; empty string if never updated
        modified_at:
          type: string
          format: date-time
          description: When the event was last updated (RFC3339); empty string if never updated
      example:
        id: 1
        event_id: "alert-disk-high-01"
        event_url: "https://monitoring.example.com/alerts/123"
        event_name: "High Disk Usage"
        event_severity: "major"
        start_time: "2026-04-15T10:00:00Z"
        end_time: ""
        created_by: "alice"
        created_at: "2026-04-15T10:00:00Z"
        modified_by: ""
        modified_at: ""

    Notification:
      type: object
      required: [id, notification_id, event_id, groups, destinations, channels, message, member_count, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        notification_id:
          type: string
          description: UUID v7 identifier for this notification
        event_id:
          type: string
          description: The event this notification was generated for
        groups:
          type: array
          items:
            type: string
          description: LDAP groups targeted by this notification
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
          description: Direct delivery targets (channel + address) for this notification
        channels:
          type: array
          items:
            type: string
            enum: [sms, voice, email]
          description: Delivery channels used for group-based targeting
        message:
          type: string
        member_count:
          type: integer
          format: int64
          description: Number of group members targeted at dispatch time
        status:
          type: string
          description: Current notification status (e.g. `pending`, `dispatched`, `failed`)
        error_message:
          type: string
          description: Error detail if the notification failed; empty string otherwise
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: Username of the user who published the notification

    Delivery:
      type: object
      required: [id, delivery_id, notification_id, group, member, channel, status, attempt, poll_attempts, sent_at]
      properties:
        id:
          type: integer
          format: int64
        delivery_id:
          type: string
          description: UUID v7 identifier for this delivery attempt
        notification_id:
          type: string
        group:
          type: string
          description: Group the member belongs to (empty for direct-destination deliveries)
        member:
          type: string
          description: Username of the recipient (empty for direct-destination deliveries)
        destination:
          type: string
          description: Actual delivery address (email or E.164 phone number)
        channel:
          type: string
          enum: [sms, voice, email]
        status:
          type: string
          description: |
            Current delivery status. Well-known terminal values: `delivered`, `failed`,
            `not_subscribed` (SMS withheld because the recipient has not opted in)
        email_template:
          type: string
          description: Email template name used (email channel only); empty string otherwise
        email_vars:
          type: object
          additionalProperties: true
          description: Template variable substitutions used for this delivery (email channel only); empty object otherwise
        attempt:
          type: integer
          format: int64
          description: Delivery attempt number (starts at 1)
        poll_attempts:
          type: integer
          format: int64
          description: Number of times the Twilio status poller has checked this delivery
        error_message:
          type: string
          description: Error detail if the delivery failed; empty string otherwise
        twilio_sid:
          type: string
          description: Twilio message/call SID for SMS and voice deliveries; empty string otherwise
        sent_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          description: When delivery was confirmed complete; empty string if still in-flight

    GroupMember:
      type: object
      required: [username, synced_at]
      properties:
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        mobile:
          type: string
          description: Mobile phone number
        work:
          type: string
          description: Work phone number
        synced_at:
          type: string
          format: date-time
          description: When this member record was last synced from LDAP

    Template:
      type: object
      required: [id, template_name, subject, body, required_vars]
      properties:
        id:
          type: integer
          format: int64
        template_name:
          type: string
        subject:
          type: string
          description: Email subject (supports Go template syntax)
        body:
          type: string
          description: Email body (supports Go template syntax)
        required_vars:
          type: array
          items:
            type: string
          description: Variable names that must be supplied when using this template
        description:
          type: string

    TemplateRequest:
      type: object
      required: [template_name, subject, body]
      properties:
        template_name:
          type: string
        subject:
          type: string
          description: Email subject (supports Go template syntax)
        body:
          type: string
          description: Email body (supports Go template syntax)
        required_vars:
          type: array
          items:
            type: string
          description: Variable names that must be present in subject/body
        description:
          type: string

    SyncGroup:
      type: object
      required: [id, group_name, created_at, created_by]
      properties:
        id:
          type: integer
          format: int64
        group_name:
          type: string
          description: LDAP group CN being synced
        created_at:
          type: string
          format: date-time
          description: When this group was added to the sync list (RFC3339)
        created_by:
          type: string
          description: Username of the admin who added this group
      example:
        id: 1
        group_name: "grp-oncall"
        created_at: "2026-04-15T10:00:00Z"
        created_by: "alice"

    SMSSubscription:
      type: object
      required: [username, phone, subscribed_at]
      properties:
        username:
          type: string
          description: The subscribed user's LDAP username
        phone:
          type: string
          description: Mobile phone number in E.164 format
        subscribed_at:
          type: string
          format: date-time
          description: When the user opted in (RFC3339)
      example:
        username: "jsmith"
        phone: "+15551234567"
        subscribed_at: "2026-04-28T10:00:00Z"

    AuditLogEntry:
      type: object
      required: [id, timestamp, username, action, impacted_table]
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        username:
          type: string
        ip_address:
          type: string
          description: Client IP from X-Client-IP header; empty string if not present
        action:
          type: string
          description: |
            Action performed. Well-known values:
            `login_failed`, `smtp_login_failed`, `create_event`, `update_event`, `end_event`,
            `create_notification`,
            `create_template`, `update_template`, `delete_template`,
            `create_sync_group`, `delete_sync_group`,
            `sms_subscribe`, `sms_subscribe_no_phone`, `sms_subscribe_failed_invalid_credentials`,
            `sms_unsubscribe`, `sms_unsubscribe_failed_invalid_credentials`,
            `sms_subscription_deleted`
        impacted_table:
          type: string
          description: Database table affected (e.g. `events`, `notifications`, `email_templates`, `auth`, `sms_subscriptions`)
        old_values:
          type: string
          description: JSON snapshot of the record before the mutation; empty string for creates
        new_values:
          type: string
          description: JSON snapshot of the record after the mutation; empty string for deletes

    PublishResponse:
      type: object
      required: [notification_id, event_id, groups, destinations, channels, message, status]
      properties:
        notification_id:
          type: string
        event_id:
          type: string
        groups:
          type: array
          items:
            type: string
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
        channels:
          type: array
          items:
            type: string
        message:
          type: string
        status:
          type: string
          description: Initial notification status (typically `pending`)

paths:
  /api/v1/notifications:
    post:
      summary: Publish a notification
      description: |
        Queues a notification for async delivery via the specified channels.
        Returns `202 Accepted` once the job is enqueued.

        Targeting can be done in two ways (or combined):
        - **Group-based**: provide `groups` + `channels`. Every member of each group
          is contacted on all listed channels.
        - **Direct**: provide `destinations` (each with a `channel` and an explicit
          `target` address). Useful for ad-hoc recipients not in LDAP groups.

        At least one of `groups` or `destinations` must be non-empty.
        When `groups` is non-empty, `channels` must also be non-empty.

        When `email` appears in `channels` or in any destination's `channel`,
        `email_template` is required.

        If `event_id` references an event that does not yet exist it is created
        automatically. If `event_id` is omitted a UUID v7 is generated.

        The `end_time` field, if supplied, marks the referenced event as ended
        (ignored if the event already has an end time).
      operationId: publishNotification
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                event_id:
                  type: string
                  description: External event identifier; auto-generated (UUID v7) if omitted
                event_url:
                  type: string
                event_name:
                  type: string
                event_description:
                  type: string
                event_severity:
                  type: string
                start_time:
                  type: string
                  format: date-time
                  description: Used when auto-creating the event; defaults to now
                end_time:
                  type: string
                  format: date-time
                  description: If provided, marks the event as ended at this time (ignored if already ended)
                groups:
                  type: array
                  items:
                    type: string
                  description: LDAP group names to notify; required when `destinations` is absent
                destinations:
                  type: array
                  items:
                    $ref: "#/components/schemas/Destination"
                  description: Direct delivery targets; required when `groups` is absent
                channels:
                  type: array
                  items:
                    type: string
                    enum: [sms, voice, email]
                  description: Channels for group-based targeting; required when `groups` is non-empty
                message:
                  type: string
                email_template:
                  type: string
                  description: Required when `email` is in `channels` or any destination uses the email channel
                email_vars:
                  type: object
                  additionalProperties: true
                  description: Template variable substitutions for email delivery
            example:
              event_id: "alert-disk-high-01"
              event_name: "High Disk Usage"
              event_severity: "major"
              groups: ["grp-oncall"]
              channels: ["sms", "email"]
              message: "Disk usage above 90% on web-01"
              email_template: "alert-standard"
              email_vars:
                host: "web-01"
                threshold: "90%"
      responses:
        "202":
          description: Notification accepted and enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "400":
          description: Missing required fields, invalid channel/address, or unknown severity
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires publisher role
        "500":
          description: Internal server error
        "503":
          description: Job queue full; retry later

  /api/v1/events:
    post:
      summary: Create an event
      description: |
        Creates a new event record. Returns `409 Conflict` if an event with the
        same `event_id` already exists. If `event_id` is omitted a UUID v7 is
        generated automatically.
      operationId: createEvent
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  description: External event identifier; auto-generated (UUID v7) if omitted
                event_url:
                  type: string
                event_name:
                  type: string
                event_description:
                  type: string
                event_severity:
                  type: string
                start_time:
                  type: string
                  format: date-time
                  description: Defaults to current time if omitted
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Missing required fields or invalid JSON
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires publisher role
        "409":
          description: An event with this event_id already exists
        "500":
          description: Internal server error

    get:
      summary: List events
      description: Returns a paginated list of events ordered by `start_time` descending.
      operationId: listEvents
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: start_from
          in: query
          description: Lower bound on `start_time` (RFC3339, inclusive)
          required: false
          schema:
            type: string
            format: date-time
        - name: start_to
          in: query
          description: Upper bound on `start_time` (RFC3339, inclusive)
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated event list
          content:
            application/json:
              schema:
                type: object
                required: [events, limit, offset]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          description: Invalid query parameters
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires reader role
        "500":
          description: Internal server error

  /api/v1/events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/event_id"

    get:
      summary: Get an event
      operationId: getEvent
      tags: [Events]
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires reader role
        "404":
          description: Event not found
        "500":
          description: Internal server error

    patch:
      summary: Update an event
      description: |
        Partially updates mutable fields on an existing event. Only fields
        included in the request body are changed; omitted fields retain their
        current values.
      operationId: updateEvent
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_url:
                  type: string
                event_name:
                  type: string
                event_description:
                  type: string
                event_severity:
                  type: string
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid JSON body or unknown severity value
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires publisher role
        "404":
          description: Event not found
        "500":
          description: Internal server error

  /api/v1/events/{event_id}/end:
    parameters:
      - $ref: "#/components/parameters/event_id"

    post:
      summary: End an event
      description: |
        Sets `end_time` on an event to mark it as resolved.
        Idempotent — if `end_time` is already set the existing event is returned
        unchanged with `200 OK`.
      operationId: endEvent
      tags: [Events]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                end_time:
                  type: string
                  format: date-time
                  description: End time (RFC3339); defaults to now if omitted
      responses:
        "200":
          description: Event ended (or already ended)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid JSON body or end_time before start_time
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires publisher role
        "404":
          description: Event not found
        "500":
          description: Internal server error

  /api/v1/events/{event_id}/notifications:
    parameters:
      - $ref: "#/components/parameters/event_id"

    get:
      summary: List notifications for an event
      operationId: listEventNotifications
      tags: [Events, Notifications]
      responses:
        "200":
          description: All notifications generated for the event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires reader role
        "404":
          description: Event not found
        "500":
          description: Internal server error

  /api/v1/notifications/{notification_id}:
    parameters:
      - $ref: "#/components/parameters/notification_id"

    get:
      summary: Get a notification
      operationId: getNotification
      tags: [Notifications]
      responses:
        "200":
          description: Notification found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires reader role
        "404":
          description: Notification not found
        "500":
          description: Internal server error

  /api/v1/notifications/{notification_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/notification_id"

    get:
      summary: List deliveries for a notification
      operationId: listNotificationDeliveries
      tags: [Notifications, Deliveries]
      responses:
        "200":
          description: All delivery attempts for the notification
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires reader role
        "404":
          description: Notification not found
        "500":
          description: Internal server error

  /api/v1/deliveries/{delivery_id}:
    parameters:
      - $ref: "#/components/parameters/delivery_id"

    get:
      summary: Get a delivery
      operationId: getDelivery
      tags: [Deliveries]
      responses:
        "200":
          description: Delivery found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires reader role
        "404":
          description: Delivery not found
        "500":
          description: Internal server error

  /api/v1/groups:
    get:
      summary: List LDAP groups
      description: Returns all distinct group names that have been synced from LDAP.
      operationId: listGroups
      tags: [Groups]
      responses:
        "200":
          description: List of synced group names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["grp-oncall", "grp-admins", "grp-monitoring"]
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires reader role
        "500":
          description: Internal server error

  /api/v1/groups/{group_name}/members:
    parameters:
      - $ref: "#/components/parameters/group_name"

    get:
      summary: List members of a group
      operationId: listGroupMembers
      tags: [Groups]
      responses:
        "200":
          description: Members of the group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires reader role
        "404":
          description: Group not found (no members have been synced for this group)
        "500":
          description: Internal server error

  /api/v1/groups/sync:
    get:
      summary: List sync groups
      description: |
        Returns all LDAP groups currently configured for periodic membership
        sync. Requires admin role.
      operationId: listSyncGroups
      tags: [Sync Groups]
      responses:
        "200":
          description: Configured sync groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncGroup"
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires admin role
        "500":
          description: Internal server error

    post:
      summary: Add a sync group
      description: |
        Adds an LDAP group to the sync list. The group must exist in LDAP.
        The syncer will begin mirroring this group's membership on the next
        sync cycle. Returns `409 Conflict` if the group is already configured.
      operationId: createSyncGroup
      tags: [Sync Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_name]
              properties:
                group_name:
                  type: string
                  description: LDAP group CN to add
            example:
              group_name: "grp-oncall"
      responses:
        "201":
          description: Sync group added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncGroup"
        "400":
          description: Invalid JSON body
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires admin role
        "409":
          description: This group is already configured for sync
        "422":
          description: group_name is required or the group does not exist in LDAP
        "500":
          description: Internal server error

  /api/v1/groups/sync/{group_name}:
    parameters:
      - $ref: "#/components/parameters/group_name"

    delete:
      summary: Remove a sync group
      description: |
        Removes a group from the sync list. The group's existing members in
        `group_members` are **not** deleted immediately — they persist until
        overwritten by a future sync of the same group name.
      operationId: deleteSyncGroup
      tags: [Sync Groups]
      responses:
        "204":
          description: Sync group removed
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires admin role
        "404":
          description: Sync group not found
        "500":
          description: Internal server error

  /api/v1/audit:
    get:
      summary: List audit log entries
      description: |
        Returns a paginated, optionally filtered view of the audit log.
        Requires admin role.
      operationId: listAuditLog
      tags: [Audit]
      parameters:
        - name: username
          in: query
          description: Filter to entries for a specific user
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: Lower bound on timestamp (RFC3339, inclusive)
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Upper bound on timestamp (RFC3339, inclusive)
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated audit log
          content:
            application/json:
              schema:
                type: object
                required: [entries, limit, offset]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          description: Invalid query parameters
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires admin role
        "500":
          description: Internal server error

  /api/v1/templates:
    post:
      summary: Create an email template
      description: Registers a new email template. Returns `409 Conflict` if the name is already taken. The template syntax (Go `html/template`) is validated before saving.
      operationId: createTemplate
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRequest"
            example:
              template_name: "alert-standard"
              subject: "Alert: {{.event_name}}"
              body: "Host {{.host}} has exceeded the {{.threshold}} threshold."
              required_vars: ["event_name", "host", "threshold"]
              description: "Standard alert notification template"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          description: Invalid JSON body
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires admin role
        "409":
          description: A template with this name already exists
        "422":
          description: Validation failed (invalid Go template syntax or required_vars not referenced in subject/body)
        "500":
          description: Internal server error

    get:
      summary: List email templates
      operationId: listTemplates
      tags: [Templates]
      responses:
        "200":
          description: All registered email templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires reader role
        "500":
          description: Internal server error

  /api/v1/templates/{template_name}:
    parameters:
      - $ref: "#/components/parameters/template_name"

    get:
      summary: Get an email template
      operationId: getTemplate
      tags: [Templates]
      responses:
        "200":
          description: Template found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires reader role
        "404":
          description: Template not found
        "500":
          description: Internal server error

    put:
      summary: Update an email template
      description: Replaces the subject, body, required_vars, and description of an existing template. The template syntax is re-validated before saving.
      operationId: updateTemplate
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRequest"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          description: Invalid JSON body
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires admin role
        "404":
          description: Template not found
        "422":
          description: Validation failed (invalid Go template syntax or required_vars not referenced in subject/body)
        "500":
          description: Internal server error

    delete:
      summary: Delete an email template
      operationId: deleteTemplate
      tags: [Templates]
      responses:
        "204":
          description: Template deleted
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires admin role
        "404":
          description: Template not found
        "500":
          description: Internal server error

  /api/v1/sms-subscriptions:
    get:
      summary: List SMS subscriptions
      description: Returns all users who have opted in to SMS notifications. Requires admin role.
      operationId: listSMSSubscriptions
      tags: [SMS Subscriptions]
      responses:
        "200":
          description: All SMS subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SMSSubscription"
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires admin role
        "500":
          description: Internal server error

    post:
      summary: Subscribe a user
      description: |
        Looks up the user's mobile number in LDAP and adds them to the SMS
        subscription list. Returns the existing subscription if the user is
        already subscribed. Also sends the user a welcome SMS via the
        dispatcher. Requires admin role.
      operationId: adminSubscribe
      tags: [SMS Subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  description: LDAP username to subscribe
            example:
              username: "jsmith"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMSSubscription"
        "200":
          description: User was already subscribed; existing record returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMSSubscription"
        "400":
          description: Missing or invalid request body
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires admin role
        "404":
          description: User not found in LDAP
        "422":
          description: User has no mobile number on record, or number is not E.164
        "500":
          description: Internal server error

  /api/v1/sms-subscriptions/me:
    post:
      summary: Subscribe self
      description: |
        Looks up the authenticated user's mobile number in LDAP and adds them
        to the SMS subscription list. Returns the existing subscription if
        already subscribed. Also sends a welcome SMS via the dispatcher.
        Any authenticated user may call this endpoint.
      operationId: selfSubscribe
      tags: [SMS Subscriptions]
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMSSubscription"
        "200":
          description: Already subscribed; existing record returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMSSubscription"
        "401":
          description: Authentication required or invalid credentials
        "404":
          description: Authenticated user not found in LDAP
        "422":
          description: You have no mobile number on record, or the number is not E.164
        "500":
          description: Internal server error

    delete:
      summary: Unsubscribe self
      description: |
        Removes the authenticated user's own SMS subscription. Any authenticated
        user may call this endpoint — no admin role required.
      operationId: selfUnsubscribe
      tags: [SMS Subscriptions]
      responses:
        "204":
          description: Subscription removed
        "401":
          description: Authentication required or invalid credentials
        "404":
          description: You are not currently subscribed
        "500":
          description: Internal server error

  /api/v1/sms-subscriptions/{username}:
    parameters:
      - $ref: "#/components/parameters/subscription_username"

    delete:
      summary: Remove a subscription
      description: Removes any user's SMS subscription. Requires admin role.
      operationId: adminDeleteSubscription
      tags: [SMS Subscriptions]
      responses:
        "204":
          description: Subscription removed
        "400":
          description: username is required
        "401":
          description: Authentication required or invalid credentials
        "403":
          description: Forbidden — requires admin role
        "404":
          description: Subscription not found
        "500":
          description: Internal server error
